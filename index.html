<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VietQR - Tạo mã QR chuyển khoản</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="logo">VietQR</h1>
            <p class="tagline">Tạo mã QR chuyển khoản nhanh chóng</p>
        </header>

        <main class="glass-card">
            <form id="qrForm">
                <!-- Bank Selection -->
                <div class="form-group">
                    <label>Ngân hàng <span class="required">*</span></label>
                    <div class="select-wrapper">
                        <select id="bankSelect" required>
                            <option value="">-- Chọn ngân hàng --</option>
                        </select>
                    </div>
                </div>

                <!-- Account Number -->
                <div class="form-group">
                    <label>Số tài khoản <span class="required">*</span></label>
                    <input type="text" id="accountNo" placeholder="Nhập số tài khoản" required>
                </div>

                <!-- Account Name -->
                <div class="form-group">
                    <label>Tên chủ tài khoản</label>
                    <input type="text" id="accountName" placeholder="Nhập tên chủ TK" style="text-transform:uppercase">
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label>Số tiền (VND)</label>
                    <input type="text" id="amount" placeholder="Nhập số tiền">
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label>Nội dung</label>
                    <input type="text" id="description" placeholder="Nội dung chuyển khoản" maxlength="50">
                </div>

                <button type="submit" class="btn-generate">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Tạo mã QR
                </button>
            </form>

            <!-- QR Result -->
            <div id="qrResult" class="qr-result" style="display:none">
                <div class="qr-frame">
                    <img id="bankLogo" class="bank-logo" src="" alt="">
                    <div id="qrCode" class="qr-code"></div>
                    <div class="napas-badge">
                        <span>Powered by</span>
                        <strong>NAPAS</strong>
                    </div>
                    <div id="accountInfo" class="account-info"></div>
                </div>
                <div class="qr-actions">
                    <button type="button" id="downloadBtn" class="btn-action">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Tải về
                    </button>
                    <button type="button" id="newBtn" class="btn-action btn-outline">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Tạo mới
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 VietQR Clone</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
